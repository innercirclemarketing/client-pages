<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Website hook</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap"><style>@layer page{
:root{--accent:#00AEC7;--dark:#004172;--ink:#333333;--soft:#444444;--tint:#EDF9FB;--alt:#F7F6F5;--line:#E1E4E8;--paper:#FFFFFF;
--on-accent:#FFFFFF;--on-dark:#FFFFFF;--r:10px;--r-btn:8px;--wrap:1120px;--gap:clamp(56px,8vw,104px)}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Poppins',Arial,sans-serif;font-weight:400;font-size:17px;line-height:1.6}
h1,h2,h3{font-family:'Poppins',Arial,sans-serif;font-weight:700;color:var(--dark);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0 0 14px;text-wrap:pretty}p:last-child{margin-bottom:0}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.pv{background:#16202A;color:#fff;font:13px/1.4 Arial,sans-serif;text-align:center;padding:7px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.top img:not([class*="bd-"]){max-height:46px;max-width:200px}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);font-family:inherit;font-weight:700;font-size:17px;line-height:1.2;
padding:16px 28px;border-radius:var(--r-btn);border:0;text-decoration:none;cursor:pointer;text-align:center;transition:transform .15s ease,box-shadow .15s ease}
.btn:not([class*="bd-"]):hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.btn.sm{font-size:15px;padding:11px 18px}
.btn.wide{display:block;width:100%}
.eyebrow{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.hero{background:var(--paper)}
.hero .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(32px,5vw,72px);align-items:center;padding:clamp(40px,6vw,84px) 0 clamp(48px,7vw,96px)}
.hero h1{font-size:clamp(34px,4.6vw,56px);margin-bottom:18px}
.hero .sub{font-size:clamp(18px,1.6vw,21px);color:var(--soft);max-width:34em;margin-bottom:24px}
.hero ul{list-style:none;margin:0 0 28px;padding:0}
.hero li{position:relative;padding:0 0 10px 30px}
.hero ul:not([class*="bd-"]) li:before{content:"";position:absolute;left:2px;top:.42em;width:14px;height:8px;border-left:3px solid var(--accent);border-bottom:3px solid var(--accent);transform:rotate(-45deg)}
.hero.dark{background:var(--dark);color:var(--on-dark)}
.hero.dark h1{color:var(--on-dark)}
.hero.dark .sub{color:var(--on-dark);opacity:.86}
.hero.dark .top .btn:not([class*="bd-"]){background:transparent;color:var(--on-dark);box-shadow:inset 0 0 0 2px currentColor}
.hero.dark .top img:not([class*="bd-"]){background:#fff;padding:8px 12px;border-radius:8px;max-height:56px}
.hero.dark .eyebrow{color:var(--on-dark);opacity:.72}
.hero.tint{background:var(--alt)}
.hero.centred .in{grid-template-columns:minmax(0,1fr);text-align:center;justify-items:center}
.hero.centred .sub{margin-left:auto;margin-right:auto}
.hero.centred ul{display:inline-block;text-align:left}
.hero .pic{border-radius:var(--r);width:100%;aspect-ratio:4/3;object-fit:cover;box-shadow:0 18px 40px rgba(0,0,0,.22)}
.sheet{background:#fff;color:#1B2A2F;border-radius:6px;padding:30px 30px 34px;box-shadow:0 24px 60px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.12);
transform:rotate(-2.2deg);max-width:400px;margin:0 auto;border-top:8px solid var(--accent)}
.sheet img{max-height:30px;max-width:130px;margin-bottom:18px}
.sheet .fmt{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sheet .ttl{font-family:'Poppins',Arial,sans-serif;font-weight:700;font-size:23px;line-height:1.2;color:var(--dark);margin-bottom:18px}
.sheet .row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid #E4EAEC}
.sheet .box{flex:0 0 17px;height:17px;border:2px solid var(--accent);border-radius:3px;margin-top:2px}
.sheet .row b{display:block;font-size:14.5px;line-height:1.3;font-weight:600}
.sheet .row i{display:block;height:6px;border-radius:3px;background:#E9EEF0;margin-top:7px}
.band{padding:var(--gap) 0}
.band.alt{background:var(--alt)}
.head{max-width:720px;margin:0 0 36px}
.head h2{font-size:clamp(27px,3vw,38px);margin-bottom:12px}
.head p{color:var(--soft);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{--pad:26px;padding:var(--pad) var(--pad) calc(var(--pad) + 2px);overflow:hidden}
.card:not([class*="bd-"]){background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.ph{width:100%;border-radius:var(--r);object-fit:cover}
.media{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
.media.left>.ph{order:-1}
.media .grid,.media .grid.three{grid-template-columns:minmax(0,1fr)}
.media .head{margin-bottom:26px}
.ph.above{margin:0 0 36px}
.card>.ph{display:block;width:calc(100% + var(--pad)*2);max-width:none;margin:calc(var(--pad)*-1) calc(var(--pad)*-1) 20px;border-radius:0}
.problem .item>.ph{margin-bottom:14px}
.quote .who{display:flex;align-items:center;gap:12px}
.quote .who img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:0 0 48px}
.thanks .panel>.ph{margin-bottom:26px}
.band.alt .card{border-color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card b,.item b{display:block;font-family:'Poppins',Arial,sans-serif;font-weight:700;color:var(--dark);font-size:19px;line-height:1.3;margin-bottom:6px}
.card span,.item span{display:block;color:var(--soft)}
.num{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;margin-bottom:16px}
.problem .item:not([class*="bd-"]){position:relative;padding:4px 0 4px 26px;border-left:3px solid var(--accent)}
.problem .item b{font-size:18px}
.rows .item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 20px;padding:22px 0;border-top:1px solid var(--line)}
.rows .item:last-child{border-bottom:1px solid var(--line)}
.rows .num{margin:0}
.quote{margin:0}
.quote p{font-size:19px;line-height:1.55;color:var(--ink);margin-bottom:16px}
.quote footer{font-size:15px;color:var(--soft);font-weight:600}
:not([class*="bd-"])>details{border-top:1px solid var(--line);padding:0}
:not([class*="bd-"])>details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:20px 44px 20px 0;position:relative;font-family:'Poppins',Arial,sans-serif;font-weight:700;color:var(--dark);font-size:19px;line-height:1.35}
summary::-webkit-details-marker{display:none}
:not([class*="bd-"])>details>summary:after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:400;color:var(--accent)}
:not([class*="bd-"])>details[open]>summary:after{content:"\2212"}
details .ans{padding:0 44px 22px 0;color:var(--soft);max-width:46em}
.prose{max-width:720px}
.prose p b{color:var(--dark);font-weight:600}
.get{background:var(--dark);color:var(--on-dark);padding:var(--gap) 0}
.get .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:clamp(32px,5vw,72px);align-items:center}
.get h2{color:var(--on-dark);font-size:clamp(27px,3vw,38px);margin-bottom:12px}
.get .lead{opacity:.86;font-size:18px}
.form{background:#fff;color:var(--ink);border-radius:var(--r);padding:30px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.form h3{font-size:22px;margin-bottom:6px}
.form .lead{color:var(--soft);font-size:16px;margin-bottom:18px;opacity:1}
.form label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.form input{display:block;width:100%;font:inherit;font-size:17px;padding:14px 14px;border:1.5px solid var(--line);border-radius:calc(var(--r)*.6);margin:0 0 16px;color:var(--ink);background:#fff}
.form input:focus{outline:3px solid var(--tint);border-color:var(--accent)}
.form .fine{font-size:13px;line-height:1.5;color:var(--soft);margin:14px 0 0}
.form .fine a{color:var(--soft);text-decoration:underline;text-underline-offset:2px}
.talk{padding:34px 0;text-align:center;color:var(--soft);border-bottom:1px solid var(--line)}
.talk a{color:var(--dark);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.foot{padding:26px 0 34px;font-size:14px;color:var(--soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.thanks{background:var(--alt);min-height:0;padding:clamp(32px,6vw,80px) 0}
.thanks .panel{background:var(--paper);border-radius:var(--r);max-width:680px;margin:0 auto;padding:clamp(28px,5vw,52px);box-shadow:0 10px 34px rgba(0,0,0,.08)}
.tick{width:58px;height:58px;border-radius:50%;background:var(--accent);position:relative;margin-bottom:22px}
.tick:after{content:"";position:absolute;left:19px;top:19px;width:20px;height:11px;border-left:4px solid var(--on-accent);border-bottom:4px solid var(--on-accent);transform:rotate(-45deg)}
.thanks h1{font-size:clamp(30px,4vw,42px);margin-bottom:12px}
.thanks .sub{font-size:19px;color:var(--soft);margin-bottom:26px}
.thanks ol{list-style:none;margin:0 0 30px;padding:0;counter-reset:n}
.thanks ol li{counter-increment:n;position:relative;padding:12px 0 12px 46px;border-top:1px solid var(--line)}
.thanks ol li:before{content:counter(n);position:absolute;left:0;top:11px;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--dark);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.first:not([class*="bd-"]){background:var(--tint);border-left:5px solid var(--accent);border-radius:calc(var(--r)*.6);padding:24px 26px}
.first h2{font-size:21px;margin-bottom:6px}
.first .btn{margin-top:14px}
.site{max-width:1040px;margin:28px auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.site .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
.site .bar img{max-height:36px;max-width:160px}
.site .nav{display:flex;gap:18px}.site .nav i{display:block;width:54px;height:9px;border-radius:5px;background:#E6EBEE}
.ghost{height:12px;border-radius:6px;background:#E9EDF0;margin:16px 22px}
.ghost.h{height:26px;margin-top:30px}
.hookband{background:var(--dark);color:var(--on-dark);margin:26px 0;padding:clamp(28px,5vw,46px) clamp(20px,5vw,56px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 40px;align-items:center}
.hookband h2{color:var(--on-dark);font-size:clamp(24px,3vw,32px);margin-bottom:8px}
.hookband p{opacity:.86;margin:0}
@media (max-width:900px){.hero .in,.get .in,.media{grid-template-columns:minmax(0,1fr)}.media>.ph{order:-1}.media>.ph[style]{aspect-ratio:3/2!important}.grid.three{grid-template-columns:minmax(0,1fr)}.sheet{margin-top:8px}}
@media (max-width:600px){body{font-size:16px}.wrap{padding:0 18px}.top img:not([class*="bd-"]){max-height:36px;max-width:150px}.grid{grid-template-columns:minmax(0,1fr)}
.hero .btn,.first .btn,.hookband .btn{display:block;width:100%}.top .btn{display:inline-block;width:auto}.card{--pad:22px}.form{padding:22px}
.rows .item{grid-template-columns:44px minmax(0,1fr);gap:6px 14px}.sheet{transform:rotate(-1.5deg);padding:24px}.hookband{grid-template-columns:minmax(0,1fr)}
.site{margin:0;border-radius:0;border-left:0;border-right:0}.foot{flex-direction:column}}
@page{size:A4;margin:14mm}
@media print{.pv,.top .btn{display:none}body{font-size:12.5px}.band,.get{padding:26px 0}.hero .in{padding:22px 0 30px}.band,.card,.item,.form,details{break-inside:avoid}
.sheet{transform:none;box-shadow:none;border:1px solid var(--line)}.btn:hover{transform:none;box-shadow:none}.thanks{min-height:0}}
}

/* The brand's own design details, from the brand master (brand-details.yml). Changed only through "update the brand". */

  --r-sm:    6px;

  --r-full: 999px;
  --card-radius: 8px;
  --shadow:  0 5px 15px rgba(0, 0, 0, 0.08);
  --space:   8px;

  --weight-heading: 700;

}

/* heading-bar: Heading accent bar (approved 17/11/2026) */
.bd-heading-bar { position: relative; font-family: var(--font-heading); font-weight: 700; font-size: 32px; line-height: 1.3; letter-spacing: -0.8px; color: var(--text-primary); margin: 0 0 20px 0; }
.bd-heading-bar::before { content: ""; display: inline-block; position: relative; top: calc(-0.1 * 1em); vertical-align: middle; height: calc(4px + 0.8em); margin-right: calc(5px + 0.2em); border-left: calc(2px + 0.16em) solid var(--accent); }
/* teal-sub-heading: Teal sub heading under a section heading (approved 17/11/2026) */
.bd-teal-sub-heading { font-family: var(--font-heading); font-weight: 700; font-size: 24px; line-height: 1.4; letter-spacing: -0.8px; color: var(--accent); margin: 0 0 20px 0; }
.bd-teal-sub-heading.bd-small { font-size: 19px; }
/* tick-circle: Ticks in lists (approved 17/11/2026) */
.bd-tick-circle { list-style: none; padding: 0; margin: 0; }
.bd-tick-circle li { position: relative; padding-left: 36px; margin: 0 0 12px 0; font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.55; color: var(--text-secondary); }
.bd-tick-circle li::before { content: ""; position: absolute; left: 0; top: 0; width: 24px; height: 24px; background-color: var(--accent); -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='M24 4C12.95 4 4 12.95 4 24c0 11.04 8.95 20 20 20 11.04 0 20-8.96 20-20 0-11.05-8.96-20-20-20zm-4 30L10 24l2.83-2.83L20 28.34l15.17-15.17L38 16 20 34z'/></svg>") center / contain no-repeat; mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='M24 4C12.95 4 4 12.95 4 24c0 11.04 8.95 20 20 20 11.04 0 20-8.96 20-20 0-11.05-8.96-20-20-20zm-4 30L10 24l2.83-2.83L20 28.34l15.17-15.17L38 16 20 34z'/></svg>") center / contain no-repeat; }
/* plain-bullet-list: Plain bullet lists in body text (approved 17/11/2026) */
.bd-plain-bullet-list { list-style: disc; padding-left: 30px; margin: 0 0 20px 0; font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.55; color: var(--text-secondary); }
/* heading-colours: Heading colours (approved 17/11/2026) */
.bd-heading-colours h2 { color: var(--text-primary); }
.bd-heading-colours .bd-card-title { color: var(--accent-alt); }
.bd-heading-colours .bd-sub { color: var(--accent); }
/* heading-type: Heading weight and spacing (approved 17/11/2026) */
.bd-heading-type { font-family: var(--font-heading); font-weight: 700; letter-spacing: -0.8px; text-transform: none; color: var(--text-primary); }
.bd-heading-type.bd-h1 { font-size: 44px; line-height: 1.2; }
.bd-heading-type.bd-h2 { font-size: 32px; line-height: 1.3; }
.bd-heading-type.bd-h3 { font-size: 24px; line-height: 1.4; }
.bd-heading-type.bd-h4 { font-size: 19px; line-height: 1.4; }
/* body-text: Body text (approved 17/11/2026) */
.bd-body-text { font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.55; color: var(--text-secondary); }
/* button-teal: Main button (approved 17/11/2026) */
.bd-button-teal { display: inline-block; box-sizing: border-box; padding: 0 30px; line-height: 46px; font-family: var(--font-body); font-size: 16px; font-weight: 500; letter-spacing: 0; text-align: center; text-decoration: none; text-transform: none; color: #FEFEFE; background-color: var(--accent); border: none; border-radius: 4px; transition: background-color 0.1s ease-in-out; cursor: pointer; }
.bd-button-teal:hover { background-color: #00A1B8; color: #FEFEFE; }
.bd-button-teal.bd-large { padding: 0 40px; line-height: 60px; }
.bd-button-teal.bd-full { display: block; width: 100%; }
/* arrow-link: Arrow link (approved 17/11/2026) */
.bd-arrow-link { position: relative; display: inline-block; padding: 0 43px 0 0; line-height: 1.55; font-family: var(--font-body); font-size: 16px; font-weight: 500; color: #FEFEFE; text-decoration: none; background: none; }
.bd-arrow-link::after { content: ""; position: absolute; top: 50%; right: 0; width: 35px; height: 10px; transform: translateY(-50%); background-color: currentColor; -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='10' viewBox='0 0 34 10'><path d='M33.59,4.3,26.06,0l-.8,1.4,5.2,2.79H0V5.81H30.46l-5.2,2.79.8,1.4,7.53-4.3A.81.81,0,0,0,33.59,4.3Z'/></svg>") right center / contain no-repeat; mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='10' viewBox='0 0 34 10'><path d='M33.59,4.3,26.06,0l-.8,1.4,5.2,2.79H0V5.81H30.46l-5.2,2.79.8,1.4,7.53-4.3A.81.81,0,0,0,33.59,4.3Z'/></svg>") right center / contain no-repeat; }
.bd-arrow-link.bd-on-light { color: var(--text-primary); }
/* text-link-teal: Teal text links (approved 17/11/2026) */
.bd-text-link-teal { color: var(--accent); text-decoration: none; font-family: var(--font-body); }
.bd-text-link-teal.bd-strong { font-weight: 700; font-size: 19px; letter-spacing: -0.8px; }
/* hero-photo: Hero photo with dark overlay (approved 17/11/2026) */
.bd-hero-photo { position: relative; padding: 120px 40px; background-color: #112337; background-size: cover; background-position: center; color: #FEFEFE; }
.bd-hero-photo::before { content: ""; position: absolute; inset: 0; background: rgba(3, 0, 0, 0.5); }
.bd-hero-photo > * { position: relative; }
.bd-hero-photo .bd-hero-label { font-family: var(--font-body); font-size: 16px; font-weight: 300; margin: 0 0 4px 0; }
.bd-hero-photo h1 { font-family: var(--font-heading); font-weight: 700; font-size: 44px; line-height: 1.2; letter-spacing: -0.8px; color: #FEFEFE; margin: 0 0 12px 0; }
.bd-hero-photo .bd-hero-sub { font-family: var(--font-heading); font-weight: 700; font-size: 24px; line-height: 1.4; letter-spacing: -0.8px; color: #FEFEFE; margin: 0 0 20px 0; max-width: 640px; }
@media (max-width: 640px) { .bd-hero-photo { text-align: center; padding: 80px 20px; } .bd-hero-photo h1 { font-size: 30px; } }
/* enquiry-card: Enquiry form card over the hero (approved 17/11/2026) */
.bd-enquiry-card { background: var(--bg-card); box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.08); padding: 40px; display: grid; grid-template-columns: 1fr 3fr; gap: 30px; margin-top: -120px; position: relative; }
.bd-enquiry-card .bd-enquiry-title { font-family: var(--font-heading); font-weight: 700; font-size: 32px; line-height: 1.3; letter-spacing: -0.8px; color: var(--text-primary); margin: 0 0 10px 0; }
.bd-enquiry-card .bd-enquiry-help { font-family: var(--font-heading); font-weight: 700; font-size: 19px; line-height: 1.4; letter-spacing: -0.8px; color: var(--accent); }
@media (max-width: 640px) { .bd-enquiry-card { grid-template-columns: 1fr; margin-top: 0; text-align: center; padding: 30px 20px; } }
/* form-fields: Form fields (approved 17/11/2026) */
.bd-form-fields input, .bd-form-fields select, .bd-form-fields textarea { box-sizing: border-box; width: 100%; height: 38px; padding: 0 12px; font-family: var(--font-body); font-size: 14px; color: #112337; background: #FFFFFF; border: 1px solid #686E77; border-radius: 3px; }
.bd-form-fields textarea { height: auto; min-height: 48px; padding: 8px 12px; }
.bd-form-fields label { display: block; font-family: var(--font-body); font-size: 14px; font-weight: 500; color: #112337; margin: 0 0 4px 0; }
.bd-form-fields .bd-required { color: #C02B0A; font-size: 12px; font-style: italic; }
/* photo-text-panel: Photo and text panel (approved 17/11/2026) */
.bd-photo-text-panel { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-card); box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.08); text-align: left; }
.bd-photo-text-panel .bd-panel-photo { background-color: #E1E4E8; background-size: cover; background-position: center; min-height: 260px; }
.bd-photo-text-panel .bd-panel-body { padding: 40px; }
.bd-photo-text-panel.bd-photo-right .bd-panel-photo { order: 2; }
@media (max-width: 960px) { .bd-photo-text-panel { grid-template-columns: 1fr; } .bd-photo-text-panel.bd-photo-right .bd-panel-photo { order: 0; } }
/* card-style: Card style (approved 17/11/2026) */
.bd-card-style { background: var(--bg-card); box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.08); padding: 40px; color: var(--text-secondary); }
/* service-photo-card: Service card with photo on top (approved 17/11/2026) */
.bd-service-photo-card { background: var(--bg-card); box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.08); }
.bd-service-photo-card .bd-card-photo { height: 180px; background-color: #E1E4E8; background-size: cover; background-position: center; }
.bd-service-photo-card .bd-card-body { padding: 20px; text-align: center; font-family: var(--font-body); font-weight: 300; color: var(--text-secondary); }
.bd-service-photo-card .bd-card-title { font-family: var(--font-heading); font-weight: 700; font-size: 24px; line-height: 1.4; letter-spacing: -0.8px; color: var(--accent-alt); margin: 0 0 12px 0; }
/* tint-band: Pale teal band (approved 17/11/2026) */
.bd-tint-band { background: var(--accent-bg); padding: 70px 40px; }
/* three-column-points: Three points side by side (approved 17/11/2026) */
.bd-three-column-points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
.bd-three-column-points h3 { font-family: var(--font-heading); font-weight: 700; font-size: 19px; line-height: 1.4; letter-spacing: -0.8px; color: var(--text-primary); margin: 0 0 12px 0; }
.bd-three-column-points p { font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.55; color: var(--text-secondary); margin: 0 0 10px 0; }
@media (max-width: 640px) { .bd-three-column-points { grid-template-columns: 1fr; } }
/* why-choose-band: Closing photo band (approved 17/11/2026) */
.bd-why-choose-band { position: relative; padding: 70px 40px; background-color: #112337; background-size: cover; background-position: center; color: #FEFEFE; }
.bd-why-choose-band::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.57); }
.bd-why-choose-band > * { position: relative; }
.bd-why-choose-band h2 { font-family: var(--font-heading); font-weight: 700; font-size: 44px; line-height: 1.2; letter-spacing: -0.8px; color: #FEFEFE; margin: 0 0 20px 0; }
.bd-why-choose-band p { font-family: var(--font-heading); font-weight: 700; font-size: 19px; line-height: 1.4; letter-spacing: -0.8px; color: #FEFEFE; max-width: 560px; margin: 0 0 20px 0; }
@media (max-width: 640px) { .bd-why-choose-band { text-align: center; padding: 50px 20px; } .bd-why-choose-band h2 { font-size: 32px; } }
/* header: Header and menu (approved 17/11/2026) */
.bd-header { display: flex; align-items: center; gap: 28px; background: #FFFFFF; padding: 10px 40px; min-height: 80px; font-family: var(--font-body); }
.bd-header .bd-header-logo { height: 88px; margin-right: auto; }
.bd-header a.bd-menu { position: relative; font-size: 17px; font-weight: 500; color: var(--text-primary); text-decoration: none; }
.bd-header a.bd-menu.bd-active { color: #000000; }
.bd-header a.bd-menu.bd-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; background: var(--accent); }
.bd-header .bd-header-phone { font-family: var(--font-heading); font-weight: 700; font-size: 19px; letter-spacing: -0.8px; color: var(--accent); text-decoration: none; }
/* footer-light: Footer (approved 17/11/2026) */
.bd-footer-light { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 30px; background: #FFFFFF; padding: 40px; font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.55; color: var(--text-secondary); }
.bd-footer-light h3 { font-family: var(--font-heading); font-size: 16px; font-weight: 500; letter-spacing: 0; color: var(--accent); margin: 0 0 12px 0; }
.bd-footer-light a { color: #000000; text-decoration: none; display: block; margin: 0 0 8px 0; }
.bd-footer-light a.bd-contact { color: var(--accent); }

/* copyright-bar: Navy copyright bar (approved 17/11/2026) */
.bd-copyright-bar { display: flex; justify-content: space-between; gap: 20px; background: var(--accent-alt); color: rgba(254, 254, 254, 0.8); padding: 20px 40px; font-family: var(--font-body); font-weight: 300; font-size: 14px; }
@media (max-width: 640px) { .bd-copyright-bar { flex-direction: column; text-align: center; } }
/* phone-bottom-bar: Phone bottom bar (approved 17/11/2026) */
.bd-phone-bottom-bar { display: grid; grid-template-columns: 1fr 1fr; font-family: var(--font-body); font-size: 16px; font-weight: 500; text-align: center; }
.bd-phone-bottom-bar a { display: block; line-height: 46px; color: #FEFEFE; text-decoration: none; }
.bd-phone-bottom-bar a:first-child { background: #00355E; }
.bd-phone-bottom-bar a:last-child { background: var(--accent); }
/* faq-rows: Questions that open and close (approved 17/11/2026) */
.bd-faq-rows > * { display: flex; align-items: center; gap: 15px; padding: 20px 0 0 0; margin: 20px 0 0 0; border-top: 1px solid rgba(0, 0, 0, 0.1); font-family: var(--font-heading); font-weight: 700; font-size: 19px; line-height: 1.4; color: var(--text-primary); }
.bd-faq-rows > *:first-child { border-top: none; margin-top: 0; padding-top: 0; }
.bd-faq-rows > *::after { content: "+"; margin-left: auto; font-weight: 300; color: var(--text-secondary); }
/* contact-rows: Contact details with line icons (approved 17/11/2026) */
.bd-contact-rows > * { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(0, 0, 0, 0.1); font-family: var(--font-heading); font-weight: 700; font-size: 19px; letter-spacing: -0.8px; color: var(--text-primary); }
.bd-contact-rows > *:first-child { border-top: none; }
/* lead-line: Bold lead line (approved 17/11/2026) */
.bd-lead-line { font-family: var(--font-heading); font-weight: 700; font-size: 20px; line-height: 1.5; color: var(--text-primary); }
/* section-spacing: Space between sections (approved 17/11/2026) */
.bd-section-spacing { padding-top: 70px; padding-bottom: 70px; }
.bd-section-spacing.bd-large { padding-top: 140px; padding-bottom: 140px; }
@media (max-width: 960px) { .bd-section-spacing, .bd-section-spacing.bd-large { padding-top: 40px; padding-bottom: 40px; } }
/* The block of questions: the brand's row look sits on each question (the summary), the answer drops underneath, and the "+" becomes a minus when a row is open. */
.bd-faq-rows > details{display:block;font:inherit;color:inherit}
.bd-faq-rows > details > summary{display:flex;align-items:center;gap:15px;font-family:var(--font-heading);font-weight:700;font-size:19px;line-height:1.4;color:var(--text-primary);padding:0}
.bd-faq-rows > details .ans{padding:12px 44px 0 0}
.bd-faq-rows > details::after{content:none}
.bd-faq-rows > details > summary::after{content:"+";margin-left:auto;font-weight:300;color:var(--text-secondary)}
.bd-faq-rows > details[open] > summary::after{content:"\2212"}
